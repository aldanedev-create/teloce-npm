[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teloce-npm"
version = "0.1.0"
description = "Use npm packages in .vel files without Node.js or node_modules."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Teloce Team", email = "team@teloce.dev" }
]
maintainers = [
    { name = "Teloce Team", email = "team@teloce.dev" }
]
keywords = ["teloce", "npm", "javascript", "vel", "python", "browser"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "semver>=3.0",
    "tqdm>=4.65",
    "tree-sitter>=0.21",
    "tree-sitter-javascript>=0.21",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
teloce-npm = "teloce_npm.__main__:main"

[project.urls]
Homepage = "https://github.com/aldanedev-create/teloce-npm"
Documentation = "https://teloce-npm.readthedocs.io"
Repository = "https://github.com/aldanedev-create/teloce-npm"
Issues = "https://github.com/aldanedev-create/teloce-npm/issues"
Changelog = "https://github.com/aldanedev-create/teloce-npm/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data][build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teloce-npm"
version = "0.1.0"
description = "Use npm packages in .vel files without Node.js or node_modules."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Teloce Team", email = "team@teloce.dev" }
]
maintainers = [
    { name = "Teloce Team", email = "team@teloce.dev" }
]
keywords = ["teloce", "npm", "javascript", "vel", "python", "browser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "semver>=3.0",
    "tqdm>=4.65",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
teloce-npm = "teloce_npm.__main__:main"

[project.urls]
Homepage = "https://github.com/aldanedev-create/teloce-npm"
Documentation = "https://teloce-npm.readthedocs.io"
Repository = "https://github.com/aldanedev-create/teloce-npm"
Issues = "https://github.com/aldanedev-create/teloce-npm/issues"
Changelog = "https://github.com/aldanedev-create/teloce-npm/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teloce_npm = ["generator/templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
teloce_npm = ["generator/templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true