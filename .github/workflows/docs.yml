name: Docs

# Vercel builds and deploys the site. This workflow only checks that the docs
# still build (a broken link fails the build) and that code blocks are valid.

on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/check_docs.py", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "scripts/check_docs.py"]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check docs code blocks
        run: python scripts/check_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - name: Build the site (fails on a broken link)
        run: npm run build
        working-directory: docs
